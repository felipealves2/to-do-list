<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="app">

        <!-- Cabeçalho -->
        <header class="header">

            <div class="logo">
                <div class="logo-icon">✓</div>

                <div>
                    <h1>Task Plan</h1>
                    <p>Organize suas tarefas</p>
                </div>
            </div>

        </header>


        <!-- Conteúdo -->
        <section class="content">

            <div class="welcome">
                <h2>Minha lista</h2>

                <span id="taskCounter">
                    0 tarefas
                </span>
            </div>


            <!-- Campo para adicionar tarefa -->
            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="O que você precisa fazer?"
                    autocomplete="off"
                >

                <button id="addButton" onclick="adicionarTarefa()">
                    <span>+</span>
                    Adicionar
                </button>

            </div>


            <!-- Lista -->
            <div class="tasks-container">

                <ul id="taskList">
                    
                </ul>


                <!-- Estado vazio -->
                <div id="emptyState" class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h3>Nenhuma tarefa ainda</h3>

                    <p>
                        Adicione sua primeira tarefa para começar.
                    </p>

                </div>

            </div>

        </section>


        <!-- Rodapé -->
        <footer>

            <span>
                 Plan
            </span>

            <span>
                Organize • Planeje • Realize
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
